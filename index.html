<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>広告案件ランチャー</title>
<meta name="robots" content="noindex,nofollow">
<link rel="icon" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="広告ランチャー">
<style>
  :root {
    --bg: #f6f7f9; --card: #ffffff; --text: #1d2330; --muted: #6b7280;
    --line: #e5e7eb; --accent: #2563eb; --ai: #7c3aed; --meisou: #059669;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #12151c; --card: #1b2030; --text: #e8eaf0; --muted: #9aa3b2;
      --line: #2a3142; --accent: #60a5fa; --ai: #a78bfa; --meisou: #34d399;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Hiragino Kaku Gothic ProN", sans-serif;
  }
  .wrap { max-width: 880px; margin: 0 auto; padding: 40px 16px 64px; }
  header { display: flex; align-items: flex-end; justify-content: space-between; gap: 16px; flex-wrap: wrap; margin-bottom: 28px; }
  h1 { font-size: 24px; margin: 0 0 4px; }
  .date { color: var(--muted); font-size: 14px; }
  .open-all {
    border: 1px solid var(--line); background: var(--card); color: var(--text);
    padding: 10px 16px; border-radius: 10px; font-size: 14px; cursor: pointer;
  }
  .open-all:hover { border-color: var(--accent); color: var(--accent); }
  section { margin-bottom: 28px; }
  h2 { font-size: 15px; margin: 0 0 12px; display: flex; align-items: center; gap: 8px; }
  h2::before { content: ""; width: 10px; height: 10px; border-radius: 3px; background: var(--c); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 12px; }
  a.card {
    display: flex; align-items: center; gap: 14px; text-decoration: none; color: inherit;
    background: var(--card); border: 1px solid var(--line); border-left: 4px solid var(--c);
    border-radius: 12px; padding: 16px; transition: transform .08s, box-shadow .15s;
  }
  a.card:hover { transform: translateY(-1px); box-shadow: 0 6px 18px rgba(0,0,0,.08); }
  .icon { font-size: 26px; line-height: 1; }
  .title { font-weight: 600; font-size: 15px; }
  .sub { color: var(--muted); font-size: 12px; margin-top: 3px; }
  .key {
    margin-left: auto; font-size: 12px; color: var(--muted);
    border: 1px solid var(--line); border-radius: 6px; padding: 2px 7px;
  }
  footer { color: var(--muted); font-size: 12px; margin-top: 36px; }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <h1>広告案件ランチャー</h1>
      <div class="date" id="date"></div>
    </div>
    <button class="open-all" id="openAll">すべてタブで開く</button>
  </header>
  <main id="main"></main>
  <footer>数字キー（1, 2, 3…）でも開けます。リンクの追加は index.html の LINKS を編集。</footer>
</div>

<script>
  // ===== ここを編集すればリンクを追加・変更できる =====
  const LINKS = [
    { group: "AI案件", color: "--ai", items: [
      { icon: "📗", title: "AI案件スプシ", sub: "Google スプレッドシート",
        url: "https://docs.google.com/spreadsheets/d/1aGVKF-mXJ6ShJgHUscQZ8-TAnyrD6QjPgCJrq9cDLR8/edit?gid=1959420177#gid=1959420177" },
      { icon: "📊", title: "AI案件ダッシュボード", sub: "VSL Direct Dashboard",
        url: "https://suya-vsl-direct-dashboard.masahirokawamura0905.workers.dev/?m=all" },
      { icon: "🎥", title: "個別相談動画一覧", sub: "Google スプレッドシート",
        url: "https://docs.google.com/spreadsheets/d/13iRJDvLAiQgtD8sPiVC77pJi9WH3jSO171DvZnPFzSE/edit?gid=489076781#gid=489076781" },
    ]},
    { group: "瞑想案件", color: "--meisou", items: [
      { icon: "📗", title: "瞑想案件スプシ", sub: "Google スプレッドシート",
        url: "https://docs.google.com/spreadsheets/d/1CvwVhN8AXsnlmflHBZDa0UYcmPHDyCKnr2XXVqf_Jl4/edit?gid=1575925857#gid=1575925857" },
    ]},
  ];
  // =====================================================

  const d = new Date();
  document.getElementById("date").textContent =
    `${d.getFullYear()}年${d.getMonth() + 1}月${d.getDate()}日（${"日月火水木金土"[d.getDay()]}）`;

  const all = [];
  const main = document.getElementById("main");
  for (const g of LINKS) {
    const sec = document.createElement("section");
    sec.style.setProperty("--c", `var(${g.color})`);
    sec.innerHTML = `<h2>${g.group}</h2><div class="grid"></div>`;
    const grid = sec.querySelector(".grid");
    for (const it of g.items) {
      all.push(it.url);
      const a = document.createElement("a");
      a.className = "card"; a.href = it.url; a.target = "_blank"; a.rel = "noopener";
      a.innerHTML = `<span class="icon">${it.icon}</span>
        <span><div class="title">${it.title}</div><div class="sub">${it.sub}</div></span>
        <span class="key">${all.length}</span>`;
      grid.appendChild(a);
    }
    main.appendChild(sec);
  }

  document.getElementById("openAll").onclick = () => {
    all.forEach(u => window.open(u, "_blank"));
  };
  document.addEventListener("keydown", e => {
    const n = parseInt(e.key, 10);
    if (n >= 1 && n <= all.length && !e.metaKey && !e.ctrlKey) window.open(all[n - 1], "_blank");
  });
</script>
</body>
</html>
